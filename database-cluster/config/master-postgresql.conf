# ===============================================================================
# PostgreSQL Master Configuration
# Optimized for Write-heavy Workload + Streaming Replication
# ===============================================================================

# -----------------------------------------------------------------------------
# EXTENSIONS (Must be loaded before database starts)
# -----------------------------------------------------------------------------
shared_preload_libraries = 'timescaledb'

# -----------------------------------------------------------------------------
# REPLICATION SETTINGS
# -----------------------------------------------------------------------------
wal_level = replica                    # Minimal WAL untuk streaming replication
max_wal_senders = 10                   # Max 10 slave connections
wal_keep_size = 1GB                    # Keep 1GB WAL untuk slave yang tertinggal
max_replication_slots = 10             # Replication slots untuk setiap slave
hot_standby = on                       # Allow read queries pada standby

# Synchronous replication (optional - enable untuk zero data loss)
# synchronous_commit = on
# synchronous_standby_names = 'slave1,slave2'

# -----------------------------------------------------------------------------
# CONNECTION SETTINGS
# -----------------------------------------------------------------------------
listen_addresses = '*'                 # Listen on all interfaces
max_connections = 200                  # Max simultaneous connections
superuser_reserved_connections = 3     # Reserved untuk maintenance

# -----------------------------------------------------------------------------
# MEMORY SETTINGS
# -----------------------------------------------------------------------------
shared_buffers = 256MB                 # Cache untuk data pages (25% of RAM recommended)
effective_cache_size = 1GB             # OS + PostgreSQL cache estimate
work_mem = 16MB                        # Memory per query operation (sort, hash)
maintenance_work_mem = 128MB           # Memory untuk VACUUM, CREATE INDEX

# -----------------------------------------------------------------------------
# WRITE-AHEAD LOG (WAL) SETTINGS
# -----------------------------------------------------------------------------
wal_buffers = 16MB                     # WAL write buffer
checkpoint_timeout = 10min             # Max time between checkpoints
checkpoint_completion_target = 0.9     # Spread checkpoint writes (90% of timeout)
max_wal_size = 2GB                     # Trigger checkpoint jika WAL > 2GB
min_wal_size = 1GB                     # Keep minimal 1GB WAL

# -----------------------------------------------------------------------------
# QUERY TUNING
# -----------------------------------------------------------------------------
random_page_cost = 1.1                 # SSD-optimized (default 4.0 untuk HDD)
effective_io_concurrency = 200         # Concurrent I/O operations (SSD)
default_statistics_target = 100        # Statistics sample size untuk query planner

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
logging_collector = on
log_destination = 'stderr'
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_line_prefix = '%m [%p] %u@%d '
log_timezone = 'Asia/Jakarta'

# Log slow queries (>1 second)
log_min_duration_statement = 1000

# Log statements
log_statement = 'ddl'                  # Log DDL statements (CREATE, ALTER, DROP)

# -----------------------------------------------------------------------------
# AUTOVACUUM (Maintenance)
# -----------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min              # Run every minute
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# -----------------------------------------------------------------------------
# LOCALE & TIMEZONE
# -----------------------------------------------------------------------------
timezone = 'Asia/Jakarta'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'
