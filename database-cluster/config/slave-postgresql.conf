# ===============================================================================
# PostgreSQL Slave/Replica Configuration
# Optimized for Read-heavy Workload (Hot Standby)
# ===============================================================================

# -----------------------------------------------------------------------------
# EXTENSIONS (Must be loaded before database starts)
# -----------------------------------------------------------------------------
shared_preload_libraries = 'timescaledb'

# -----------------------------------------------------------------------------
# REPLICATION SETTINGS (STANDBY MODE)
# -----------------------------------------------------------------------------
hot_standby = on                       # Allow read-only queries on replica
max_standby_streaming_delay = 30s      # Max delay before canceling queries
wal_receiver_timeout = 60s             # Timeout untuk WAL receiver
wal_retrieve_retry_interval = 5s       # Retry interval jika stream terputus

# -----------------------------------------------------------------------------
# CONNECTION SETTINGS
# -----------------------------------------------------------------------------
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 3

# -----------------------------------------------------------------------------
# MEMORY SETTINGS (Optimized for Read Queries)
# -----------------------------------------------------------------------------
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 16MB
maintenance_work_mem = 128MB

# -----------------------------------------------------------------------------
# QUERY TUNING
# -----------------------------------------------------------------------------
random_page_cost = 1.1                 # SSD-optimized
effective_io_concurrency = 200
default_statistics_target = 100

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
logging_collector = on
log_destination = 'stderr'
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_line_prefix = '%m [%p] %u@%d '
log_timezone = 'Asia/Jakarta'
log_min_duration_statement = 1000
log_statement = 'ddl'

# -----------------------------------------------------------------------------
# AUTOVACUUM (Less aggressive on replica)
# -----------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 2min

# -----------------------------------------------------------------------------
# LOCALE & TIMEZONE
# -----------------------------------------------------------------------------
timezone = 'Asia/Jakarta'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'
