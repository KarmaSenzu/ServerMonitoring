# Nginx config untuk container `web` di docker-compose.
# Serve SPA build dari /usr/share/nginx/html dan reverse-proxy semua
# API prefix ke service Docker `api` port 3001.

# Resolver Docker internal supaya DNS service name `api` selalu fresh
# kalau container restart.
resolver 127.0.0.11 ipv6=off valid=10s;

# Upstream variable supaya nginx tidak panic kalau `api` belum siap saat
# nginx start (depends_on tidak menjamin readiness).
map $host $api_upstream {
    default "http://api:3001";
}

# Helper: kalau request mau HTML (browser navigasi SPA), fall back ke
# index.html. Selain itu (XHR/fetch JSON), proxy ke backend.
map $http_accept $is_html_request {
    default 0;
    "~*text/html" 1;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (dasar; CSP minta tuning di-app sebelum nyalakan strict)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # Gzip untuk asset teks
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Health probe untuk Docker HEALTHCHECK
    location = /health.txt {
        access_log off;
        try_files /health.txt =404;
    }

    # Static asset caching (hashed filenames dari Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SSE endpoint khusus events stream — disable buffering
    location /events {
        # Kalau Accept text/html (SPA nav ke /events page), fall back
        if ($is_html_request) {
            rewrite ^ /index.html last;
        }
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # API prefix yang TIDAK bentrok dengan SPA route — proxy langsung
    location ~ ^/(auth|system|docker|pm2|discovery|generator|health|alerts|webhooks)(/|$) {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API prefix yang BENTROK dengan SPA route — fall back kalau HTML
    location ~ ^/(projects|users|events|notifications|backups|environments)(/|$) {
        if ($is_html_request) {
            rewrite ^ /index.html last;
        }
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback untuk semua route lain
    location / {
        try_files $uri $uri/ /index.html;
    }
}
